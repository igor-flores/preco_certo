<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="base-path" content="{{PATH}}">
    <meta name="theme-color" content="#10291a">
    <title>{{TITULO}} · Preço Certo</title>
    <link rel="icon" href="{{PATH}}Assets/img/icone.svg" type="image/svg+xml">
    <link rel="stylesheet" href="{{PATH}}Assets/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="{{PATH}}Assets/css/base.css?v={{VERSAO}}">
    <link rel="stylesheet" href="{{PATH}}Assets/css/painel.css?v={{VERSAO}}">
</head>
<body data-pagina="{{PAGINA}}">
    <a class="pular" href="#conteudo">Pular para o conteúdo</a>
    <div class="painel" id="painel">
        <aside class="barra-lateral" id="barra-lateral" aria-label="Menu principal">
            <a class="marca" href="{{PATH}}">
                <span class="marca-icone"><i class="fa-solid fa-tags" aria-hidden="true"></i></span>
                Preço Certo
            </a>
            <div class="negocio-atual">
                <span>Seu negócio</span>
                <strong id="nome-negocio">&nbsp;</strong>
            </div>
            <nav class="menu" aria-label="Seções">
                <a href="{{PATH}}" data-pagina="inicio"><i class="fa-solid fa-house" aria-hidden="true"></i>Início</a>
                <a href="{{PATH}}pedidos/" data-pagina="pedidos"><i class="fa-solid fa-receipt" aria-hidden="true"></i>Pedidos</a>
                <a href="{{PATH}}produtos/" data-pagina="produtos"><i class="fa-solid fa-cookie-bite" aria-hidden="true"></i>Produtos</a>
                <a href="{{PATH}}materias-primas/" data-pagina="materias-primas"><i class="fa-solid fa-wheat-awn" aria-hidden="true"></i>Matérias-primas</a>
                <a href="{{PATH}}cardapio/" data-pagina="cardapio"><i class="fa-solid fa-book-open" aria-hidden="true"></i>Cardápio</a>
                <a href="{{PATH}}vendas/" data-pagina="vendas"><i class="fa-solid fa-clock-rotate-left" aria-hidden="true"></i>Histórico de vendas</a>
                <a href="{{PATH}}relatorios/" data-pagina="relatorios"><i class="fa-solid fa-chart-line" aria-hidden="true"></i>Relatórios</a>
            </nav>
            <div class="menu menu-rodape">
                <button type="button" id="botao-sair"><i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>Sair</button>
            </div>
        </aside>
        <div class="fundo-menu" id="fundo-menu" hidden></div>
        <div class="area-principal">
            <header class="topo-movel">
                <button type="button" class="botao botao-icone" id="abrir-menu" aria-label="Abrir menu" aria-expanded="false" aria-controls="barra-lateral">
                    <i class="fa-solid fa-bars" aria-hidden="true"></i>
                </button>
                <strong>Preço Certo</strong>
            </header>
            <main class="conteudo" id="conteudo" tabindex="-1">
{{CONTEUDO}}
            </main>
        </div>
    </div>
    <div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
